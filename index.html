<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Print Profit v1.8</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#20242a;background:#f5f6f8;font-size:14px}*{box-sizing:border-box}body{margin:0;padding:18px 12px}.app{max-width:480px;margin:auto;background:#fff;border:1px solid #dce0e5;border-radius:15px;padding:14px;display:flex;flex-direction:column;gap:13px}.head,.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.head strong{font-size:19px}.muted{color:#717983}.small{font-size:11px}.field{display:flex;flex-direction:column;gap:5px;min-width:0}label{font-size:12px;color:#555e68;font-weight:550}input{width:100%;min-width:0;border:1px solid #d8dde4;border-radius:8px;background:#fff;padding:11px 9px;font:inherit;color:inherit;height:43px}input:focus{outline:2px solid #a8c6f7;outline-offset:0}.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.part-head,.part-row{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,3fr) minmax(0,3fr) 25px;gap:7px;align-items:center}.part-row input{height:37px;padding:7px 6px;font-size:13px}.part-head{margin-bottom:6px}.part-row{margin-bottom:7px}.part-row button{border:0;background:transparent;color:#65707b;font-size:19px;padding:0;cursor:pointer}.separator{height:1px;background:#e8ebef}.btn{border:1px solid #d5dae1;background:#fff;border-radius:9px;padding:10px 9px;font:inherit;font-weight:550;cursor:pointer;min-height:39px}.btn:disabled{opacity:.45}.full{width:100%}.segments{display:grid;grid-template-columns:1fr 1fr;background:#eef0f3;border-radius:9px;padding:3px;gap:3px}.segments button{font-size:12px;border:0;background:transparent;border-radius:7px;padding:10px 4px;color:#58616c;font-weight:600}.segments button.active{background:#fff;color:#20242a;box-shadow:0 1px 4px #0002}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.value{background:#f2f4f6;border-radius:8px;height:43px;display:flex;align-items:center;padding:9px;font-weight:700;font-size:18px;white-space:nowrap}.control{height:43px;display:flex;align-items:center}.control input{height:43px}.control input[type=range]{padding:0;accent-color:#262c34}.summary{background:#f3f5f7;border-radius:10px;padding:13px 10px;display:flex;flex-direction:column;gap:9px}.summary .three>div{min-width:0}.summary .three strong{display:block;margin-top:5px;font-size:14px;overflow-wrap:anywhere}.danger-text{color:#b82f36}.actions{display:grid;grid-template-columns:1fr auto;gap:8px}.primary{background:#252a31;color:white;border-color:#252a31}.danger{background:#b82f36;color:white;border-color:#b82f36}.confirm{height:18px;text-align:center;font-size:12px;color:#b82f36;font-weight:600}footer{font-size:11px;color:#79818a;line-height:1.5}#partsArea{display:none}#partsArea.show{display:block}#partsTotalRow{display:none}#partsTotalRow.show{display:flex}button{touch-action:manipulation}@media(max-width:360px){.app{padding:11px;gap:11px}.summary .three strong{font-size:12px}.head strong{font-size:17px}}
</style></head><body><main class="app"><div class="head"><strong>▣ Print Profit</strong><span class="muted small">v1.8</span></div><div class="field"><label for="name">商品名</label><input id="name" value="キーホルダー" placeholder="例：ネコのキーホルダー"></div><div class="three"><div class="field"><label for="fp">材料価格 ¥</label><input id="fp" type="number" min="0" value="2500" placeholder="例：2500"></div><div class="field"><label for="fw">材料重量 g</label><input id="fw" type="number" min="0" value="1000" placeholder="例：1000"></div><div class="field"><label for="iw">作品重量 g</label><input id="iw" type="number" min="0" value="20" placeholder="例：20"></div></div><div class="separator"></div><section id="partsArea"><div class="row" style="margin-bottom:9px"><strong>▧ 追加部品</strong><span class="muted small">単価 × 数量</span></div><div class="part-head"><label>部品名</label><label>単価 ¥</label><label>数量</label><span></span></div><div id="partRows"></div></section><button class="btn full" id="addPart">＋ 部品を追加</button><div class="row small" id="partsTotalRow"><span class="muted">追加部品の合計</span><strong id="partsTotal">0円</strong></div><div class="separator"></div><div class="segments"><button id="modePrice" class="active" aria-pressed="true">価格 → 利益率</button><button id="modeMargin" aria-pressed="false">利益率 → 価格</button></div><div class="two"><div class="field"><div class="row"><label id="inputLabel">販売価格（円）</label><strong id="targetLabel" style="display:none">75%</strong></div><div class="control"><input id="price" type="number" min="0" value="200" placeholder="例：200"><input id="target" type="range" min="5" max="95" step="1" value="75" style="display:none"></div></div><div class="field"><label id="resultLabel">利益率</label><div class="value" id="result">—</div></div></div><div class="summary"><div class="three"><div><span class="muted small">総原価</span><strong id="cost">—</strong></div><div><span class="muted small">販売価格</span><strong id="sale">—</strong></div><div><span class="muted small">差引利益</span><strong id="profit">—</strong></div></div><div class="row small muted"><span id="filamentCost">フィラメント原価 —</span><span id="partsCost">部品原価 —</span></div></div><div><div class="confirm" id="confirm"></div><div class="actions"><button class="btn primary" id="copy">▢ 結果をコピー</button><button class="btn" id="clear">全クリア</button></div></div><footer>※ フィラメント代・追加部品代のみで計算。電気代・送料・販売手数料などは含みません。</footer></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),fmt=n=>new Intl.NumberFormat('ja-JP',{maximumFractionDigits:2}).format(n)+'円';let parts=[],nextId=1,mode='price',confirm=false;const numeric=v=>v.trim()!==''&&Number.isFinite(Number(v))&&Number(v)>=0;function renderParts(){const area=$('partsArea'),rows=$('partRows');area.classList.toggle('show',parts.length>0);$('partsTotalRow').classList.toggle('show',parts.length>0);rows.replaceChildren();for(const p of parts){const r=document.createElement('div');r.className='part-row';for(const [key,placeholder,type] of [['name','例：チェーン','text'],['price','0','number'],['qty','1','number']]){const inp=document.createElement('input');inp.type=type;inp.placeholder=placeholder;inp.value=p[key];if(type==='number')inp.min='0';inp.setAttribute('aria-label',key==='name'?'部品名':key==='price'?'単価':'数量');inp.addEventListener('input',()=>{p[key]=inp.value;calculate()});r.append(inp)}const del=document.createElement('button');del.textContent='×';del.setAttribute('aria-label','部品を削除');del.addEventListener('click',()=>{parts=parts.filter(x=>x.id!==p.id);renderParts();calculate()});r.append(del);rows.append(r)}}function calculate(){const valid=[...['fp','fw','iw'].map(id=>$(id).value)].every(numeric)&&Number($('fw').value)>0&&parts.every(p=>(p.price===''||numeric(p.price))&&(p.qty===''||(numeric(p.qty)&&Number.isInteger(Number(p.qty)))));const filament=valid?Number($('fp').value)/Number($('fw').value)*Number($('iw').value):0;const pc=parts.reduce((s,p)=>s+(Number(p.price)||0)*(Number(p.qty)||0),0),cost=filament+pc;const sale=mode==='margin'?Math.ceil(cost/(1-Number($('target').value)/100)):Number($('price').value);const ok=valid&&(mode==='margin'?sale>0:numeric($('price').value)&&sale>0);const profit=sale-cost,margin=sale>0?profit/sale*100:0;$('partsTotal').textContent=valid?fmt(pc):'—';$('cost').textContent=ok?fmt(cost):'—';$('sale').textContent=ok?fmt(sale):'—';$('profit').textContent=ok?fmt(profit):'—';$('profit').classList.toggle('danger-text',ok&&profit<0);$('result').textContent=ok?(mode==='price'?margin.toFixed(1)+'%':fmt(sale)):'—';$('filamentCost').textContent='フィラメント原価 '+(valid?fmt(filament):'—');$('partsCost').textContent='部品原価 '+(valid?fmt(pc):'—');$('copy').disabled=!ok;return{ok,filament,pc,cost,sale,profit,margin}}function setMode(m){mode=m;const isMargin=m==='margin';$('modePrice').classList.toggle('active',!isMargin);$('modeMargin').classList.toggle('active',isMargin);$('modePrice').setAttribute('aria-pressed',String(!isMargin));$('modeMargin').setAttribute('aria-pressed',String(isMargin));$('inputLabel').textContent=isMargin?'目標利益率':'販売価格（円）';$('resultLabel').textContent=isMargin?'必要販売価格':'利益率';$('price').style.display=isMargin?'none':'block';$('target').style.display=isMargin?'block':'none';$('targetLabel').style.display=isMargin?'block':'none';calculate()}function setConfirm(value){confirm=value;$('confirm').textContent=value?'入力内容をすべて消去しますか？':'';$('copy').textContent=value?'キャンセル':'▢ 結果をコピー';$('clear').textContent=value?'クリアする':'全クリア';$('clear').classList.toggle('danger',value);$('copy').disabled=!value&&!calculate().ok}for(const id of ['name','fp','fw','iw','price'])$(id).addEventListener('input',calculate);$('target').addEventListener('input',()=>{$('targetLabel').textContent=$('target').value+'%';calculate()});$('addPart').addEventListener('click',()=>{parts.push({id:nextId++,name:'',price:'',qty:'1'});renderParts();calculate()});$('modePrice').addEventListener('click',()=>setMode('price'));$('modeMargin').addEventListener('click',()=>setMode('margin'));$('copy').addEventListener('click',async()=>{if(confirm){setConfirm(false);return}const v=calculate();if(!v.ok)return;const report=`【${$('name').value.trim()||'商品名未設定'}】\nフィラメント原価：${fmt(v.filament)}\n${parts.map(p=>`${p.name||'部品'}：${fmt(Number(p.price||0)*Number(p.qty||0))}（${p.qty||0}個）`).join('\n')}\n追加部品合計：${fmt(v.pc)}\n総原価：${fmt(v.cost)}\n販売価格：${fmt(v.sale)}\n差引利益：${fmt(v.profit)}\n利益率：${v.margin.toFixed(1)}%`;try{await navigator.clipboard.writeText(report);$('copy').textContent='コピーしました';setTimeout(()=>{if(!confirm)$('copy').textContent='▢ 結果をコピー'},1500)}catch(e){const t=document.createElement('textarea');t.value=report;document.body.append(t);t.select();document.execCommand('copy');t.remove();$('copy').textContent='コピーしました';setTimeout(()=>{if(!confirm)$('copy').textContent='▢ 結果をコピー'},1500)}});$('clear').addEventListener('click',()=>{if(!confirm){setConfirm(true);return}for(const id of ['name','fp','fw','iw','price'])$(id).value='';parts=[];nextId=1;$('target').value='75';$('targetLabel').textContent='75%';renderParts();setMode('price');setConfirm(false);calculate()});renderParts();calculate()})();
</script></body></html>
